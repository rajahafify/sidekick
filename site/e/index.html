<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join on Sidekick</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- With the app installed, Android opens event links straight in the app (App Links).
       This page is for everyone else. -->
  <main>
    <svg class="mark" viewBox="24 52 152 120" aria-hidden="true"><circle cx="36" cy="113" r="12" fill="#fff"/><circle cx="164" cy="113" r="12" fill="#fff"/><rect x="30" y="52" width="140" height="120" rx="56" fill="#fff"/><rect x="50" y="76" width="100" height="70" rx="35" fill="#000"/><path d="M68 110 Q80 94 92 110 M108 110 Q120 94 132 110" stroke="#ff5a36" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M88 126 Q100 136 112 126" stroke="#ff5a36" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
    <div class="eyebrow">You're invited</div>
    <h1>Send your <em>sidekick</em> in.</h1>
    <p>Someone shared an event on Sidekick. Check in with the app and your sidekick scouts the room for you while you stay in the talk.</p>
    <div class="card">
      <a class="btn" id="open" href="#">Open in the app</a>
      <a class="btn ghost" href="https://play.google.com/store/apps/details?id=com.artifisi.sidekick">Get the Android app</a>
    </div>
  </main>
  <script>
    // An intent link opens the app if it's installed, and the Play Store if not.
    var path = location.pathname + location.search;
    document.getElementById('open').href =
      'intent://sidekick.artifisi.com' + path + '#Intent;scheme=https;package=com.artifisi.sidekick;end';
  </script>
</body>
</html>
