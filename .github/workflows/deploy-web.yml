name: Deploy web

# Builds the Flutter app for the web and publishes it at the site (sidekick.artifisi.com).
# Runs on every push to main that touches the app, or by hand from the Actions tab.
# Needs: secret AWS_DEPLOY_ROLE_ARN (the stack's DeployRoleArn output) and repo variables
# AWS_REGION, IDENTITY_POOL_ID, API_URL, GOOGLE_WEB_CLIENT_ID, SITE_BUCKET, SITE_DISTRIBUTION_ID
# (optional SITE_URL, default https://sidekick.artifisi.com).
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: App settings from the repo variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IDENTITY_POOL_ID: ${{ vars.IDENTITY_POOL_ID }}
          API_URL: ${{ vars.API_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$IDENTITY_POOL_ID" ] || [ -z "$API_URL" ]; then echo "::error::Set the repo variables first (README step 4)."; exit 1; fi
          python3 - <<'PY'
          import json, os
          keys = ['AWS_REGION', 'IDENTITY_POOL_ID', 'API_URL', 'GOOGLE_WEB_CLIENT_ID', 'SITE_URL']
          json.dump({k: os.environ[k] for k in keys if os.environ.get(k)}, open('env.json', 'w'))
          PY
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      - name: Upload
        env:
          BUCKET: ${{ vars.SITE_BUCKET }}
          DIST: ${{ vars.SITE_DISTRIBUTION_ID }}
        run: |
          # Hashed assets can be cached for long; the entry files must always be fresh.
          aws s3 sync build/web "s3://$BUCKET" --delete --exclude '.well-known/*' \
            --cache-control 'public,max-age=3600'
          for f in index.html flutter_bootstrap.js flutter_service_worker.js main.dart.js manifest.json version.json; do
            if [ -f "build/web/$f" ]; then
              aws s3 cp "build/web/$f" "s3://$BUCKET/$f" --cache-control 'no-cache'
            fi
          done
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' >/dev/null
          echo "Published."
