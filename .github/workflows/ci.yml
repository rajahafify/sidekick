name: CI

# Tests the backend and app. (The signed Android app is built by the Android app workflow.) While we're prototyping it only runs on
# demand (Actions → CI → Run workflow) or when a version tag like v0.3.0 is pushed. It never blocks
# a deploy: the backend Deploy workflow and the Cloudflare Pages build don't wait for it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: API tests (privacy rules, guests, matching, check-ins, sidekick)
        run: npm test
      - name: Synthesize the AWS stack
        run: npm run synth -- -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Web build compiles
        run: flutter build web --release --no-web-resources-cdn
