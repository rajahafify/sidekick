name: CI

# Tests every pull request and push to main, and builds the Android APK.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: API tests (privacy rules, guests, matching, check-ins, sidekick)
        run: npm test
      - name: Synthesize the AWS stack
        run: npm run synth -- -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: App settings from the repo variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IDENTITY_POOL_ID: ${{ vars.IDENTITY_POOL_ID }}
          API_URL: ${{ vars.API_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ['AWS_REGION', 'IDENTITY_POOL_ID', 'API_URL', 'GOOGLE_WEB_CLIENT_ID']
          json.dump({k: os.environ.get(k, '') for k in keys if os.environ.get(k)}, open('env.json', 'w'))
          PY
          if [ -z "$IDENTITY_POOL_ID" ]; then echo "::warning::Repo variables not set yet: the APK will show 'Almost there' (see README step 4)."; fi
      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key, so Google sign-in won't work in this APK."
          fi
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
