name: Deploy

# Deploys everything: the AWS backend (API, data, sign-in), then the Flutter web app on GitHub Pages
# at sidekick.artifisi.com (Settings → Pages → Source: GitHub Actions, custom domain). Runs on every push to main, or by hand from the Actions tab (Run workflow).
#
# Repo settings (Settings → Secrets and variables → Actions):
#   secrets   AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY  an IAM admin access key, for the first run
#             AWS_DEPLOY_ROLE_ARN                         optional: once set, used instead of the key
#             OPENROUTER_API_KEY                          the sidekick's model key (stored in SSM)
#   variables GOOGLE_WEB_CLIENT_ID, ALERT_EMAIL
#             optional: SITE_DOMAIN, SITE_CERTIFICATE_ARN, ANDROID_CERT_SHA256, LLM_PROVIDER, MODEL_ID
on:
  push:
    branches: [main]
    paths: ['app/**', 'backend/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  USE_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.out.outputs.ApiUrl }}
      identity_pool_id: ${{ steps.out.outputs.IdentityPoolId }}
      site_bucket: ${{ steps.out.outputs.SiteBucket }}
      site_distribution_id: ${{ steps.out.outputs.SiteDistributionId }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then echo "::error::Add the repo variable GOOGLE_WEB_CLIENT_ID (README step 3)."; exit 1; fi
          if [ "$USE_ROLE" != true ] && [ "$HAS_KEY" != true ]; then echo "::error::Add the secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (README step 3)."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - if: env.USE_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - if: env.USE_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - name: Store the OpenRouter key
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            aws ssm put-parameter --name /sidekick/openrouter-api-key --type SecureString --value "$KEY" --overwrite >/dev/null
            echo "Stored."
          else
            echo "::warning::No OPENROUTER_API_KEY secret, so the sidekick uses its template."
          fi
      - name: Bootstrap CDK (first run only)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit >/dev/null 2>&1; then
            npx cdk bootstrap -c googleClientId="$GOOGLE_WEB_CLIENT_ID" \
              "aws://$(aws sts get-caller-identity --query Account --output text)/$AWS_REGION"
          fi
      - name: Deploy
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_CERTIFICATE_ARN: ${{ vars.SITE_CERTIFICATE_ARN }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
          MODEL_ID: ${{ vars.MODEL_ID }}
        run: |
          npx cdk deploy --require-approval never --outputs-file out.json \
            -c googleClientId="$GOOGLE_WEB_CLIENT_ID" \
            -c alertEmail="$ALERT_EMAIL" \
            -c siteDomain="$SITE_DOMAIN" \
            -c siteCertificateArn="$SITE_CERTIFICATE_ARN" \
            -c androidCertSha256="$ANDROID_CERT_SHA256" \
            -c llmProvider="$LLM_PROVIDER" \
            ${MODEL_ID:+-c modelId="$MODEL_ID"}
      - id: out
        name: Outputs
        run: |
          python3 - <<'PY'
          import json, os
          out = json.load(open('out.json'))['Sidekick']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Deployed\n\n| Output | Value |\n|---|---|\n')
              for k, v in out.items():
                  f.write(f'| {k} | `{v}` |\n')
          PY

  web:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: App settings from the backend
        env:
          IDENTITY_POOL_ID: ${{ needs.backend.outputs.identity_pool_id }}
          API_URL: ${{ needs.backend.outputs.api_url }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SITE_URL: https://${{ vars.SITE_DOMAIN || 'sidekick.artifisi.com' }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ['AWS_REGION', 'IDENTITY_POOL_ID', 'API_URL', 'GOOGLE_WEB_CLIENT_ID', 'SITE_URL']
          json.dump({k: os.environ[k] for k in keys if os.environ.get(k)}, open('env.json', 'w'))
          PY
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env.json
      - name: GitHub Pages extras
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          cd build/web
          touch .nojekyll            # serve .well-known as is
          cp index.html 404.html     # app routes like /e/<id> load the app
          mkdir -p .well-known
          python3 - <<'PY'
          import json, os
          fps = [s.strip() for s in os.environ.get('ANDROID_CERT_SHA256', '').split(',') if s.strip()]
          links = [{'relation': ['delegate_permission/common.handle_all_urls'],
                    'target': {'namespace': 'android_app', 'package_name': 'com.artifisi.sidekick',
                               'sha256_cert_fingerprints': fps}}] if fps else []
          json.dump(links, open('.well-known/assetlinks.json', 'w'))
          PY
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - uses: actions/deploy-pages@v4
