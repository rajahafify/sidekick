name: Deploy backend

# Deploys the AWS stack (API, data, identities, website hosting). Run it by hand from the Actions tab.
# Needs: secret AWS_DEPLOY_ROLE_ARN (the stack's DeployRoleArn output, after the first deploy from CloudShell),
# and repo variables GOOGLE_WEB_CLIENT_ID and ALERT_EMAIL (optional: SITE_DOMAIN,
# SITE_CERTIFICATE_ARN, ANDROID_CERT_SHA256).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Deploy
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_CERTIFICATE_ARN: ${{ vars.SITE_CERTIFICATE_ARN }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          npx cdk deploy --require-approval never \
            -c googleClientId="$GOOGLE_WEB_CLIENT_ID" \
            -c alertEmail="$ALERT_EMAIL" \
            -c siteDomain="$SITE_DOMAIN" \
            -c siteCertificateArn="$SITE_CERTIFICATE_ARN" \
            -c androidCertSha256="$ANDROID_CERT_SHA256"
